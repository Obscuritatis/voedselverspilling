/* Layout: sitebalk bovenaan, afdelingslijst links (chips op gsm), werkvlak rechts. Zelfde basis als de veiligheidsrondes en staalnamen. */
:root {

  --muted: #5d6b62;

  --accent-soft: #e2efe8;
  --ochre: #a8741f;
  --ochre-soft: #f6ecd8;
  --red: #b23b2e;
  --red-soft: #f7e3df;
  --blue: #3b6390;
  --blue-soft: #e3ebf4;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141a17; --surface: #1c2420; --ink: #e6ece7; --muted: #9aa89f; --line: #2e3a33;
  --accent: #6fbf9c; --accent-soft: #21362c; --ochre: #e0ad5a; --ochre-soft: #3a2f1c;

:root[data-theme="dark"] {
  --bg: #141a17; --surface: #1c2420; --ink: #e6ece7; --muted: #9aa89f; --line: #2e3a33;
  --accent: #6fbf9c; --accent-soft: #21362c; --ochre: #e0ad5a; --ochre-soft: #3a2f1c;
  --red: #ef8a7d; --red-soft: #3d2420; --blue: #8fb3dc; --blue-soft: #1f2c3b; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5 }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15 }
h1 { font-size: 2.2rem; font-weight: 700; text-transform: uppercase }
h2 { letter-spacing: .01em }
h2 { font-size: 1.6rem; font-weight: 700 }
h3 { font-size: 1.25rem; font-weight: 700 }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)) }
.sign { width: 40px; height: 40px; flex: none; border-radius: 4px; background: var(--accent); display: grid; place-items: center }
.sign svg { width: 26px; height: 26px }
.who { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); min-width: 0; overflow-wrap: anywhere }
.banner { padding: 10px 14px; border-radius: 6px; background: var(--ochre-soft); color: var(--ochre); font-size: .9rem; margin-bottom: 16px }
.login { max-width: 420px; display: grid; gap: 12px }
.login label { display: grid; gap: 4px; font-size: .82rem; color: var(--muted) }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 20px }
.brand { display: flex; align-items: center; gap: 14px }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; min-width: 0 }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: .72rem; color: var(--muted); font-weight: 700 }
select, input, textarea, button { font: inherit; color: inherit }
select, input, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0 }
textarea { resize: vertical; min-height: 60px }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
button { cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px }
button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700 }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 8px }
button.ghost:hover { color: var(--red) }
button:disabled { opacity: .5; cursor: not-allowed }
.layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; align-items: start }
nav.afd { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px) }

nav.afd button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700 }
nav.afd button:hover:not([aria-current="true"]) { background: var(--surface) }

nav.afd .count { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums }
@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr) }
  nav.afd { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px }
  nav.afd .grp { display: none }
  nav.afd button { white-space: nowrap; border: 1px solid var(--line); background: var(--surface) }
  nav.afd .count { display: none }
}
main { min-width: 0; display: flex; flex-direction: column; gap: 24px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
@media (max-width: 700px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.stat { padding: 14px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line) }
.stat b { display: block; font-family: var(--font-display); font-size: 2rem; font-variant-numeric: tabular-nums; line-height: 1.1 }
.stat span { color: var(--muted); font-size: .85rem }
.row-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px }

.tablewrap { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: .92rem }
th { text-align: left; font-weight: 700; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px; border-bottom: 1px solid var(--line) }
td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle }
td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap }
tr.click { cursor: pointer }
tr.click:hover td { background: var(--accent-soft) }
.bar { height: 8px; background: var(--accent-soft); border-radius: 4px; overflow: hidden; min-width: 60px }
.bar i { display: block; height: 100%; background: var(--accent) }
.bars { display: flex; flex-direction: column; gap: 10px }
.bars .b { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) 4.5rem; gap: 10px; align-items: center; font-size: .9rem }
.bars .b .num { text-align: right; font-variant-numeric: tabular-nums }
.pill { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap }
.p-hoog { background: var(--red-soft); color: var(--red) }
.p-midden { background: var(--ochre-soft); color: var(--ochre) }
.p-laag { background: var(--blue-soft); color: var(--blue) }
.p-ok { background: var(--accent-soft); color: var(--accent) }
.p-mute { background: var(--bg); color: var(--muted); border: 1px solid var(--line) }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px }
@media (max-width: 900px) { .two { grid-template-columns: minmax(0, 1fr) } }
form.f { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: end }
form.f .full { grid-column: 1 / -1 }
form.f label { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--muted); min-width: 0 }
@media (max-width: 480px) { form.f { grid-template-columns: minmax(0, 1fr) } }
.list { display: flex; flex-direction: column }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 0; border-bottom: 1px solid var(--line) }
.item:last-child { border-bottom: 0 }
.item .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .82rem; color: var(--muted) }
.item p { margin: 0 }
.item .side { display: flex; gap: 6px; align-items: start }
.item .side select { width: auto; padding: 3px 6px; font-size: .82rem }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chips button { font-size: .8rem; padding: 4px 9px; border-radius: 99px; background: var(--bg); text-align: left }
.chips button:hover { border-color: var(--accent); color: var(--accent) }
.hint { color: var(--muted); font-size: .88rem; margin: 0 }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto }
.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: transparent; padding: 8px 12px; white-space: nowrap }
.tabs button[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--accent); font-weight: 700 }
.empty { padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px }
.focus { font-size: .85rem }
.focus .pill { white-space: normal }
td.nowrap { white-space: nowrap }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: .9rem; z-index: 10 }

.matrix > div { border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0 }

.matrix ul { margin: 0; padding-left: 18px; font-size: .88rem }
@media (prefers-reduced-motion: no-preference) { tr.click td, nav.afd button { transition: background .15s } }
