/* Layout: groene appbalk bovenaan, afdelingslijst links (chips op gsm), werkvlak rechts. */
:root {
  --bg: #f3f0e8;
  --surface: #ffffff;
  --surface-2: #faf8f3;
  --ink: #1c2a22;
  --muted: #627066;
  --line: #e6e1d6;
  --accent: #1f6b4e;
  --accent-2: #2f8f66;
  --accent-soft: #e1f0e7;
  --on-accent: #ffffff;
  --ochre: #a86a12;
  --ochre-soft: #fbeed6;
  --red: #c2452f;
  --red-soft: #fbe3dc;
  --blue: #2f6596;
  --blue-soft: #e2edf7;
  --bar-top: #17533c;
  --bar-bottom: #23785a;
  --s-bordrest: #e0673f;
  --s-overproductie: #e9a42b;
  --s-bederf: #8b5fae;
  --s-bereiding: #2b8f9c;
  --shadow: 0 1px 2px rgba(28, 42, 34, .06), 0 6px 20px rgba(28, 42, 34, .07);
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121815; --surface: #1b231f; --surface-2: #202a25; --ink: #e8eee9; --muted: #9eaca3; --line: #2c3832;
  --accent: #6cc79c; --accent-2: #4fae83; --on-accent: #0f2219; --accent-soft: #1f3a2d; --ochre: #f0b65c; --ochre-soft: #3b2e19;
  --red: #f2907f; --red-soft: #3f2520; --blue: #8db8e2; --blue-soft: #1d2d3d; --bar-top: #0f3528; --bar-bottom: #17503b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121815; --surface: #1b231f; --surface-2: #202a25; --ink: #e8eee9; --muted: #9eaca3; --line: #2c3832;
  --accent: #6cc79c; --accent-2: #4fae83; --on-accent: #0f2219; --accent-soft: #1f3a2d; --ochre: #f0b65c; --ochre-soft: #3b2e19;
  --red: #f2907f; --red-soft: #3f2520; --blue: #8db8e2; --blue-soft: #1d2d3d; --bar-top: #0f3528; --bar-bottom: #17503b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1 }
h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: .01em }
h2 { font-size: 2rem; font-weight: 700; letter-spacing: .01em }
h3 { font-size: 1.3rem; font-weight: 700 }
.ic { width: 20px; height: 20px; flex: none }
.ic.groot { width: 40px; height: 40px }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }

/* Appbalk */
.appbar { background: linear-gradient(135deg, var(--bar-top), var(--bar-bottom)); color: #fff; padding-top: env(safe-area-inset-top, 0px); position: relative; overflow: hidden }
.appbar::after { content: ""; position: absolute; right: -60px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.12), transparent 70%); pointer-events: none }
.appbar .inner { max-width: 1240px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; position: relative; z-index: 1 }
.brand { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; color: inherit; text-align: left; border-radius: 14px }
.appbar button.brand, .appbar button.brand:hover { background: none; border: 0 }
.sign { width: 44px; height: 44px; flex: none; border-radius: 14px; background: rgba(255,255,255,.16); display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2) }
.sign svg { width: 28px; height: 28px }
.brand .sub { font-size: .8rem; opacity: .8; letter-spacing: .02em }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-width: 0 }
.appbar select { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.22); color: #fff; border-radius: 99px; padding: 7px 14px; font-weight: 600 }
.appbar select option { color: #1c2a22 }
.appbar button { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.22); color: #fff; border-radius: 99px }
.appbar button:hover { background: rgba(255,255,255,.24) }
.who { display: flex; align-items: center; gap: 10px; font-size: .85rem; opacity: .95; min-width: 0; overflow-wrap: anywhere }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 22px; padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)) }

.banner { padding: 10px 14px; border-radius: 12px; background: var(--ochre-soft); color: var(--ochre); font-size: .9rem; margin-bottom: 16px }
.eyebrow { text-transform: uppercase; letter-spacing: .09em; font-size: .72rem; color: var(--muted); font-weight: 700 }
select, input, textarea, button { font: inherit; color: inherit }
select, input, textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; min-width: 0 }
select:focus, input:focus, textarea:focus { border-color: var(--accent-2); background: var(--surface) }
.appbar select:focus { background: rgba(255,255,255,.24); border-color: rgba(255,255,255,.6); color: #fff }
textarea { resize: vertical; min-height: 60px }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px }
button { cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; display: inline-flex; align-items: center; gap: 8px; justify-content: center }
button .ic { width: 18px; height: 18px }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; box-shadow: 0 4px 12px rgba(31, 107, 78, .25) }
button.primary:hover { filter: brightness(1.08) }
button.groot { width: 100%; padding: 13px 18px; font-size: 1.05rem; border-radius: 14px }
button.soft { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600 }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 8px }
button.ghost:hover { color: var(--red) }
button:disabled { opacity: .5; cursor: not-allowed }

/* Hoofdindeling */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 26px; align-items: start }
body.uit .layout { grid-template-columns: minmax(0, 1fr) }
body.uit nav.afd { display: none }
body.start .layout { grid-template-columns: minmax(0, 1fr) }
body.start nav.afd { display: none }
/* Beginscherm met een tegel per site */
.totaal { margin-top: 8px; background: linear-gradient(140deg, var(--bar-top), var(--accent-2)); color: #fff; border-radius: 22px; padding: 22px; box-shadow: var(--shadow) }
.totaal .eyebrow { color: rgba(255,255,255,.8) }
.totaal p { margin: 6px 0 0 }
.totaal-kop { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px }
.totaal .seg { background: rgba(255,255,255,.14); box-shadow: none }
.totaal .seg button { color: #fff }
.totaal .seg button[aria-pressed="true"] { background: #fff; color: var(--bar-top) }
.totaal-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 24px; align-items: center }
@media (max-width: 700px) { .totaal-grid { grid-template-columns: minmax(0, 1fr) } }
.totaal-cijfer > b { display: block; font-family: var(--font-display); font-size: 3.2rem; line-height: 1 }
.totaal-cijfer > span { display: block; color: rgba(255,255,255,.85) }
.trend { display: inline-block !important; margin-top: 8px; padding: 3px 10px; border-radius: 99px; font-size: .8rem; font-weight: 700; background: rgba(255,255,255,.18) }
.totaal-mini { display: flex; gap: 22px; margin-top: 14px }
.totaal-mini span { display: flex; flex-direction: column; font-size: .8rem; color: rgba(255,255,255,.8) }
.totaal-mini b { font-family: var(--font-display); font-size: 1.5rem; color: #fff; line-height: 1.1 }
.totaal-sites { display: flex; flex-direction: column; gap: 10px }
.totaal-sites .b { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: .9rem }
.totaal-sites .bar { grid-column: 1 / -1; background: rgba(255,255,255,.18); box-shadow: none }
.totaal-sites .bar i { background: #fff }
.totaal-sites .num { font-weight: 700 }
.start-kop { margin-bottom: 4px }
.site-tegels { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 16px }
.site-tegel { --kc: var(--accent); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 20px; border: 0; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); min-height: 170px; color: var(--ink) }
.site-tegel::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 6px; background: var(--kc) }
.site-tegel::after { content: ""; position: absolute; right: -50px; top: -50px; width: 160px; height: 160px; border-radius: 50%; background: var(--kc); opacity: .08 }
.site-tegel.keuken { --kc: var(--s-overproductie); background: var(--surface-2); border: 2px dashed var(--line) } .site-tegel.k1 { --kc: var(--s-bordrest) } .site-tegel.k2 { --kc: var(--s-bereiding) } .site-tegel.k3 { --kc: var(--s-bederf) }
.site-tegel:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(28, 42, 34, .08), 0 14px 30px rgba(28, 42, 34, .12) }
.site-ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--kc); color: #fff; margin-bottom: 6px }
.site-ic .ic { width: 24px; height: 24px }
.site-naam { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; line-height: 1.1 }
.site-sub { color: var(--muted); font-size: .9rem }
.site-pijl { margin-top: auto; align-self: flex-end; color: var(--kc) }
.site-pijl .ic { width: 24px; height: 24px }
@media (prefers-reduced-motion: no-preference) { .site-tegel { transition: transform .15s, box-shadow .15s } }
nav.afd { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); background: var(--surface); border-radius: 18px; padding: 10px; box-shadow: var(--shadow); max-height: calc(100vh - 28px); overflow-y: auto }
nav.afd button { text-align: left; border: 0; background: transparent; padding: 9px 10px; display: flex; justify-content: space-between; gap: 8px; align-items: center; border-radius: 10px }
nav.afd .nl { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1 1 auto }
nav.afd .nm { display: flex; flex-direction: column; min-width: 0; overflow-wrap: break-word; line-height: 1.3 }
nav.afd .nl .ic { width: 18px; height: 18px; color: var(--muted) }
nav.afd button[aria-current="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600 }
nav.afd button[aria-current="true"] .ic, nav.afd button[aria-current="true"] .count { color: var(--on-accent); opacity: .9 }
nav.afd button:hover:not([aria-current="true"]) { background: var(--surface-2) }
nav.afd .grp { margin: 14px 10px 4px }
.nav-gsm { display: none; align-items: center; gap: 10px; min-width: 0 }
.nav-gsm span { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px }
nav.afd .nav-gsm .terug { flex: none; background: var(--accent); color: var(--on-accent); border-radius: 99px; padding: 8px 14px; font-weight: 600 }
button.terug { align-self: flex-start; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 99px; padding: 8px 14px; font-weight: 600; color: var(--accent) }
.kies { display: flex; flex-direction: column; gap: 6px }
.kies .grp { margin: 10px 4px 2px }
.kies-lijst { display: flex; flex-direction: column; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden }
.kies-rij { display: flex; align-items: center; gap: 12px; width: 100%; justify-content: flex-start; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 15px 16px; font-size: 1rem; font-weight: 600 }
.kies-rij:last-child { border-bottom: 0 }
.kies-rij span { flex: 1; min-width: 0 }
.kies-rij .ic { color: var(--muted) }
.kies-rij:active { background: var(--surface-2) }
.kies-extra { display: flex; flex-wrap: wrap; gap: 8px }
nav.afd .count { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap }
.ndot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--line); display: inline-block }
.ndot.d-hoog { background: var(--red) }
.ndot.d-midden { background: var(--s-overproductie) }
.ndot.d-ok { background: var(--accent-2) }
.ndot.d-mute { background: transparent; box-shadow: inset 0 0 0 2px var(--line) }
@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 18px }
  /* Op gsm: enkel een balk terug naar de afdelingskeuze; de volledige lijst staat op het keuzescherm. */
  nav.afd { position: static; padding: 6px; max-height: none; border-radius: 99px }
  nav.afd:has(.nav-gsm) > :not(.nav-gsm) { display: none }
  .nav-gsm { display: flex !important }
  h2 { font-size: 1.7rem }
  .brand .sub { display: none }
}
main { min-width: 0; display: flex; flex-direction: column; gap: 22px }
.panel { background: var(--surface); border-radius: 18px; padding: 20px; box-shadow: var(--shadow) }
.row-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px }
.kop-acties { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }

/* Kerncijfers */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px }
@media (max-width: 900px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.stat { padding: 16px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); display: flex; gap: 12px; align-items: flex-start; min-width: 0 }
.stat > div { min-width: 0 }
.stat b { display: block; font-family: var(--font-display); font-size: 2.1rem; font-variant-numeric: tabular-nums; line-height: 1.05 }
.stat span { color: var(--muted); font-size: .84rem; line-height: 1.35; display: block }
.stat .stat-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent) }
.stat.t-blue .stat-ic { background: var(--blue-soft); color: var(--blue) }
.stat.t-amber .stat-ic { background: var(--ochre-soft); color: var(--ochre) }
.stat.t-green .stat-ic { background: var(--accent-soft); color: var(--accent) }
.stat.hero { background: linear-gradient(140deg, var(--bar-top), var(--accent-2)); color: #fff }
.stat.hero span { color: rgba(255,255,255,.85) }
.stat.hero .stat-ic { background: rgba(255,255,255,.18); color: #fff }
@media (max-width: 480px) { .stat { flex-direction: column; gap: 8px } .stat b { font-size: 1.8rem } }

.seg { display: inline-flex; background: var(--surface); border-radius: 99px; padding: 3px; box-shadow: var(--shadow) }
.seg button { border: 0; border-radius: 99px; padding: 5px 12px; font-size: .85rem; background: transparent }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600 }

/* Tabellen */
.tablewrap { overflow-x: auto; margin: 0 -6px }
table { width: 100%; border-collapse: collapse; font-size: .92rem }
th { text-align: left; font-weight: 700; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; padding: 8px; border-bottom: 1px solid var(--line) }
td { padding: 11px 8px; border-bottom: 1px solid var(--line); vertical-align: middle }
tbody tr:last-child td { border-bottom: 0 }
td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap }
tr.click { cursor: pointer }
tr.click:hover td { background: var(--surface-2) }
.afd-cel { display: flex; gap: 10px; align-items: center }
.huidig-veld { width: 4.6rem; padding: 5px 8px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600 }
.bezet-rij { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-top: 6px }
.bezet-rij label { display: inline-flex; align-items: center; gap: 8px }
/* Op gsm wordt elke afdeling een kaartje: naam en gewicht, balk, per aanwezige en focus. */
@media (max-width: 640px) {
  .afd-tabel thead { display: none }
  .afd-tabel tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 12px 6px; border-bottom: 1px solid var(--line) }
  .afd-tabel tbody tr:last-child { border-bottom: 0 }
  .afd-tabel td { border: 0; padding: 0; background: none !important }
  .afd-tabel td:nth-child(7), .afd-tabel td:nth-child(8) { display: none }
  .afd-tabel td:nth-child(5), .afd-tabel td:nth-child(9) { grid-column: 1 / -1 }
  .afd-tabel td:nth-child(4) { font-weight: 700; align-self: center; grid-column: 2; grid-row: 1 }
  .afd-tabel td:nth-child(2), .afd-tabel td:nth-child(3), .afd-tabel td:nth-child(6) { text-align: left; font-size: .85rem }
  .afd-tabel td:nth-child(2)::before { content: "Max. "; color: var(--muted) }
  .afd-tabel td:nth-child(3)::before { content: "Huidig "; color: var(--muted) }
  .afd-tabel td:nth-child(6) { grid-column: 1 / -1 }
  .afd-tabel td:nth-child(6)::before { content: "Per aanwezige: "; color: var(--muted) }
}

/* Balken en ring */
.bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; min-width: 60px; box-shadow: inset 0 0 0 1px var(--line) }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px }
.bars { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 0 }
.bars .b { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) 4.5rem; gap: 10px; align-items: center; font-size: .9rem }
.bars .b .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600 }
.bars .lbl { display: flex; align-items: center; gap: 8px; min-width: 0 }
.dot-ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; flex: none; color: #fff; background: var(--sc, var(--accent)) }
.dot-ic .ic { width: 17px; height: 17px }
.s-bordrest { --sc: var(--s-bordrest) }
.s-overproductie { --sc: var(--s-overproductie) }
.s-bederf { --sc: var(--s-bederf) }
.s-bereiding { --sc: var(--s-bereiding) }
.b[class*=" s-"] .bar i { background: var(--sc) }
.verdeling { display: flex; gap: 22px; align-items: center; flex-wrap: wrap }
.verdeling .bars { flex: 1 1 200px }
.bars .b { grid-template-columns: minmax(0, 1fr) auto; row-gap: 5px }
